spring.application.name=collectsmart-backend

server.port=8081

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/collectsmart_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

 # JWT Authentication

app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:60}

# Manager Account

app.bootstrap.manager.email=${BOOTSTRAP_MANAGER_EMAIL:}
app.bootstrap.manager.password=${BOOTSTRAP_MANAGER_PASSWORD:}

# Field Officer Account

app.bootstrap.officer.email=${BOOTSTRAP_OFFICER_EMAIL:}
app.bootstrap.officer.password=${BOOTSTRAP_OFFICER_PASSWORD:}
app.bootstrap.officer.id=${BOOTSTRAP_OFFICER_ID:}

# Officer 2 Account
app.bootstrap.officer2.email=${BOOTSTRAP_OFFICER2_EMAIL:}
app.bootstrap.officer2.password=${BOOTSTRAP_OFFICER2_PASSWORD:}
app.bootstrap.officer2.id=${BOOTSTRAP_OFFICER2_ID:}